name: postgresql

services:
  postgresql:
    image: postgres:18.6
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      # 18 起数据在 /var/lib/postgresql/18/docker
      - ./data:/var/lib/postgresql
