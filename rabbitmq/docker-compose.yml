name: rabbitmq

services:
  rabbitmq:
    image: rabbitmq:4.4.0-management
    container_name: rabbitmq
    hostname: rabbitmq  # 固定节点名 rabbit@rabbitmq，否则重建容器后数据目录对不上
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理界面
    volumes:
      - ./data:/var/lib/rabbitmq
