services:
  loki:
    image: grafana/loki:3.7.1
    container_name: loki
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./config.yaml:/etc/loki/config.yaml:ro
    networks:
      - loki-network

  grafana:
    image: grafana/grafana:11.3.9
    container_name: loki-grafana
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
    depends_on:
      - loki
    networks:
      - loki-network

networks:
  loki-network:
    driver: bridge

volumes:
  loki_data:
  grafana_data:
