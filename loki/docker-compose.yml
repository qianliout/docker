name: loki

services:
  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    environment:
      TZ: Asia/Shanghai
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./config.yaml:/etc/loki/config.yaml:ro

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
    depends_on:
      - loki

volumes:
  loki_data:
  grafana_data:
